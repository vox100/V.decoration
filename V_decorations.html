        // --- ARABIC DECORATION FUNCTIONS ---
        const ARABIC_MARK_RE = /^[\u064B-\u065F\u0670\u06D6-\u06ED]$/u;

        function decorateArabicTashkeelLight(text) {
            const chars = [...text];
            let index = 0;
            return chars.map((char, i) => {
                if (!/[\u0621-\u064A]/u.test(char)) return char;
                // Keep existing user-supplied tashkeel intact.
                if (chars[i + 1] && ARABIC_MARK_RE.test(chars[i + 1])) return char;
                const mark = TASHKEEL.light[(char.codePointAt(0) + index * 3) % TASHKEEL.light.length];
                index++;
                return index % 3 === 0 ? char : char + mark;
            }).join('');
        }

        function decorateArabicTashkeelHeavy(text) {
            const chars = [...text];
            let index = 0;
            return chars.map((char, i) => {
                if (!/[\u0621-\u064A]/u.test(char)) return char;
                if (chars[i + 1] && ARABIC_MARK_RE.test(chars[i + 1])) return char;
                const mark = TASHKEEL.heavy[(char.codePointAt(0) + index * 5) % TASHKEEL.heavy.length];
                index++;
                return char + mark + (index % 2 === 0 ? TASHKEEL.heavy[(index + 4) % TASHKEEL.heavy.length] : '');
            }).join('');
        }

        // Split into user-perceived characters (keeps emoji and Arabic marks together).
        function getGraphemes(text) {
            if (typeof Intl !== 'undefined' && Intl.Segmenter) {
                const segmenter = new Intl.Segmenter('ar', { granularity: 'grapheme' });
                return [...segmenter.segment(text)].map(part => part.segment);
            }
            // Fallback for older WebViews: combine common Unicode marks with their base.
            return [...text].reduce((out, ch) => {
                if (/\p{M}/u.test(ch) && out.length) out[out.length - 1] += ch;
                else out.push(ch);
                return out;
            }, []);
        }

        function firstArabicLetter(grapheme) {
            return [...grapheme].find(ch => /[\u0621-\u064A\u066E-\u06D3\u06FA-\u06FC]/u.test(ch)) || '';
        }

        function decorateArabicKashida(text) {
            const chars = getGraphemes(text);
            const nonJoiners = new Set([...'ءاأإآٱدذرزؤةىو']);
            let result = '';
            chars.forEach((grapheme, i) => {
                result += grapheme;
                const current = firstArabicLetter(grapheme);
                const next = chars[i + 1] ? firstArabicLetter(chars[i + 1]) : '';
                if (current && next && !nonJoiners.has(current)) result += 'ـ';
            });
            return result;
        }

        function decorateArabicSpaced(text) {
            return getGraphemes(text).join(' • ');
        }

        function decorateArabicKashidaDotted(text) {
            let kashida = decorateArabicKashida(text);
            return kashida.replace(/ـ/g, 'ـ’ـ');
        }

        // --- UNICODE MAPPER FUNCTION ---
        function applyUnicodeMap(text, mapObj) {
            return [...text].map(char => mapObj[char] || char).join('');
        }

        function applyOverlay(text, overlayChar) {
            return getGraphemes(text).map(char => /^\s+$/u.test(char) ? char : char + overlayChar).join('');
        }

        function flipText(text) {
            return getGraphemes(text).map(char => UNICODE_MAPS.upsideDown[char] || char).reverse().join('');
        }

        // Storage is optional (private mode, file:// and quota restrictions may block it).
        function readStoredJSON(key, fallback, validate) {
            try {
                const raw = window.localStorage.getItem(key);
                if (raw === null) return fallback;
                const value = JSON.parse(raw);
                return validate(value) ? value : fallback;
            } catch (error) {
                return fallback;
            }
        }

        function writeStoredJSON(key, value) {
            try {
                window.localStorage.setItem(key, JSON.stringify(value));
                return true;
            } catch (error) {
                return false;
            }
        }

        function readStoredString(key, fallback = '') {
            try {
                const value = window.localStorage.getItem(key);
                return typeof value === 'string' ? value : fallback;
            } catch (error) {
                return fallback;
            }
        }

        // --- STATE & APP DATA ---
        let state = {
            inputText: "V.decorations",
            activeCategory: "all",
            searchQuery: "",
            mixMode: true,
            favorites: (() => {
                const saved = readStoredJSON('v_decor_favs', [], Array.isArray);
                return [...new Set(saved.filter(v => typeof v === 'string' && v.length > 0 && [...v].length <= 500))].slice(0, 300);
            })(),
            extraMixSeed: 0
        };

        // --- GENERATION ENGINE ---
        function generateAllDecorations(text, mixMode) {
            if (!text || text.trim() === '') return [];

            const results = [];
            const isEnglish = /[a-zA-Z]/.test(text);
            const isArabic = /[\u0600-\u06FF]/.test(text);

            // 1. Core Font Variations (English + General)
            if (isEnglish) {
                results.push({ id: 'en-bold', text: applyUnicodeMap(text, UNICODE_MAPS.bold), title: 'عريض (Bold)', cat: 'english' });
                results.push({ id: 'en-italic', text: applyUnicodeMap(text, UNICODE_MAPS.italic), title: 'مائل (Italic)', cat: 'english' });
                results.push({ id: 'en-bold-italic', text: applyUnicodeMap(text, UNICODE_MAPS.boldItalic), title: 'عريض مائل (Bold Italic)', cat: 'english' });
                results.push({ id: 'en-script', text: applyUnicodeMap(text, UNICODE_MAPS.script), title: 'مخطوط رقعي (Script)', cat: 'english' });
                results.push({ id: 'en-bold-script', text: applyUnicodeMap(text, UNICODE_MAPS.boldScript), title: 'مخطوط عريض (Bold Script)', cat: 'english' });
                results.push({ id: 'en-fraktur', text: applyUnicodeMap(text, UNICODE_MAPS.fraktur), title: 'قوطي (Fraktur/Gothic)', cat: 'english' });
                results.push({ id: 'en-bold-fraktur', text: applyUnicodeMap(text, UNICODE_MAPS.boldFraktur), title: 'قوطي عريض (Bold Fraktur)', cat: 'english' });
                results.push({ id: 'en-double-struck', text: applyUnicodeMap(text, UNICODE_MAPS.doubleStruck), title: 'مزدوج التخطيط (Double Struck)', cat: 'english' });
                results.push({ id: 'en-monospace', text: applyUnicodeMap(text, UNICODE_MAPS.monospace), title: 'برمجي أحادي (Monospace)', cat: 'english' });
                results.push({ id: 'en-circled', text: applyUnicodeMap(text, UNICODE_MAPS.circled), title: 'داخل دوائر (Circled)', cat: 'english' });
                results.push({ id: 'en-neg-circled', text: applyUnicodeMap(text, UNICODE_MAPS.negativeCircled), title: 'دوائر سوداء (Negative Circled)', cat: 'english' });
                results.push({ id: 'en-squared', text: applyUnicodeMap(text, UNICODE_MAPS.squared), title: 'مربعات (Squared)', cat: 'english' });
                results.push({ id: 'en-neg-squared', text: applyUnicodeMap(text, UNICODE_MAPS.negativeSquared), title: 'مربعات سوداء (Negative Squared)', cat: 'english' });
                results.push({ id: 'en-fullwidth', text: applyUnicodeMap(text, UNICODE_MAPS.fullwidth), title: 'تباعد عريض (Fullwidth)', cat: 'english' });
                results.push({ id: 'en-smallcaps', text: applyUnicodeMap(text, UNICODE_MAPS.smallCaps), title: 'حروف صغيرة عريضة (Small Caps)', cat: 'english' });
                results.push({ id: 'en-flipped', text: flipText(text), title: 'مقلوب رأسًا على عقب (Flipped)', cat: 'english' });
                results.push({ id: 'en-strikethrough', text: applyOverlay(text, OVERLAYS.strikethrough), title: 'مشطوب (Strikethrough)', cat: 'clean' });
                results.push({ id: 'en-underline', text: applyOverlay(text, OVERLAYS.underline), title: 'مسطر (Underline)', cat: 'clean' });
                results.push({ id: 'en-double-underline', text: applyOverlay(text, OVERLAYS.doubleUnderline), title: 'سطرين (Double Underline)', cat: 'clean' });
                results.push({ id: 'en-slash', text: applyOverlay(text, OVERLAYS.slash), title: 'خطوط مائلة (Slash-through)', cat: 'clean' });
            }

            // 2. Arabic Specific Decorations
            if (isArabic) {
                results.push({ id: 'ar-tashkeel-light', text: decorateArabicTashkeelLight(text), title: 'تشكيل خفيف مرتب', cat: 'arabic' });
                results.push({ id: 'ar-tashkeel-heavy', text: decorateArabicTashkeelHeavy(text), title: 'تشكيل مكثف مزخرف', cat: 'arabic' });
                results.push({ id: 'ar-kashida', text: decorateArabicKashida(text), title: 'تطويل الحروف (كشيدة)', cat: 'arabic' });
                results.push({ id: 'ar-kashida-dotted', text: decorateArabicKashidaDotted(text), title: 'تطويل منقط', cat: 'arabic' });
                results.push({ id: 'ar-spaced', text: decorateArabicSpaced(text), title: 'حروف متباعدة بنقاط', cat: 'arabic' });
            }

            // 3. Frames & Brackets Engine (Applying text into Frames)
            FRAMES.forEach((frame, idx) => {
                const framedText = frame.template.replace('TEXT', text);
                results.push({
                    id: `frame-${idx}`,
                    text: framedText,
                    title: `${frame.tag}`,
                    cat: frame.cat || 'frames'
                });
            });

            // 4. Mixed Engine (Combining Styled Fonts/Tashkeel + Frames) if mixMode is enabled
            if (mixMode) {
                const fontBaseVariants = [];
                if (isEnglish) {
                    fontBaseVariants.push({ name: 'عريض', text: applyUnicodeMap(text, UNICODE_MAPS.bold) });
                    fontBaseVariants.push({ name: 'مخطوط', text: applyUnicodeMap(text, UNICODE_MAPS.script) });
                    fontBaseVariants.push({ name: 'قوطي', text: applyUnicodeMap(text, UNICODE_MAPS.boldFraktur) });
                    fontBaseVariants.push({ name: 'مزدوج', text: applyUnicodeMap(text, UNICODE_MAPS.doubleStruck) });
                    fontBaseVariants.push({ name: 'أحادي', text: applyUnicodeMap(text, UNICODE_MAPS.monospace) });
                    fontBaseVariants.push({ name: 'دوائر', text: applyUnicodeMap(text, UNICODE_MAPS.circled) });
                }
                if (isArabic) {
                    fontBaseVariants.push({ name: 'تشكيل', text: decorateArabicTashkeelLight(text) });
                    fontBaseVariants.push({ name: 'كشيدة', text: decorateArabicKashida(text) });
                }

                // Combine selected base variants with random frames
                FRAMES.forEach((frame, fIdx) => {
                    fontBaseVariants.forEach((variant, vIdx) => {
                        const combinedText = frame.template.replace('TEXT', variant.text);
                        results.push({
                            id: `mix-${fIdx}-${vIdx}`,
                            text: combinedText,
                            title: `${frame.tag} + ${variant.name}`,
                            cat: frame.cat === 'gaming' ? 'gaming' : 'clean'
                        });
                    });
                });
            }

            // 5. Extra Dynamic Generated Mixes (based on extraMixSeed)
            if (state.extraMixSeed > 0 && FRAMES.length) {
                const enVariants = [
                    t => applyUnicodeMap(t, UNICODE_MAPS.bold),
                    t => applyUnicodeMap(t, UNICODE_MAPS.italic),
                    t => applyUnicodeMap(t, UNICODE_MAPS.boldItalic),
                    t => applyUnicodeMap(t, UNICODE_MAPS.script),
                    t => applyUnicodeMap(t, UNICODE_MAPS.boldScript),
                    t => applyUnicodeMap(t, UNICODE_MAPS.fraktur),
                    t => applyUnicodeMap(t, UNICODE_MAPS.boldFraktur),
                    t => applyUnicodeMap(t, UNICODE_MAPS.doubleStruck),
                    t => applyUnicodeMap(t, UNICODE_MAPS.monospace),
                    t => applyUnicodeMap(t, UNICODE_MAPS.circled),
                    t => applyUnicodeMap(t, UNICODE_MAPS.negativeCircled),
                    t => applyUnicodeMap(t, UNICODE_MAPS.squared),
                    t => applyUnicodeMap(t, UNICODE_MAPS.negativeSquared),
                    t => applyUnicodeMap(t, UNICODE_MAPS.fullwidth),
                    t => applyUnicodeMap(t, UNICODE_MAPS.smallCaps),
                    t => applyOverlay(t, OVERLAYS.underline),
                    t => applyOverlay(t, OVERLAYS.strikethrough),
                    t => applyOverlay(t, OVERLAYS.slash),
                    t => flipText(t)
                ];
                const arVariants = [
                    t => decorateArabicTashkeelLight(t),
                    t => decorateArabicTashkeelHeavy(t),
                    t => decorateArabicKashida(t),
                    t => decorateArabicKashidaDotted(t),
                    t => decorateArabicSpaced(t),
                    t => applyOverlay(t, OVERLAYS.underline),
                    t => applyOverlay(t, OVERLAYS.doubleUnderline)
                ];
                const symbols = ['★', '✦', '✦', '♔', '✿', '❖', '༒', '☬', '꧁', '꧂', '•', '✧', '☠', '🔥'];
                const seen = new Set(results.map(item => item.text));
                let added = 0;
                const total = Math.min(400, Math.max(0, state.extraMixSeed) * 20);
                let seed = 2166136261;
                for (const ch of `${text}|${state.extraMixSeed}`) seed = Math.imul(seed ^ ch.codePointAt(0), 16777619) >>> 0;
                const next = max => { seed = (Math.imul(seed, 1664525) + 1013904223) >>> 0; return seed % max; };

                for (let attempt = 0; attempt < total * 8 && added < total; attempt++) {
                    const frame = FRAMES[next(FRAMES.length)];
                    const variants = isEnglish && isArabic ? [...enVariants, ...arVariants] : (isEnglish ? enVariants : (isArabic ? arVariants : [t => t]));
                    let processed = variants[next(variants.length)](text);
                    if (attempt % 3 === 1) {
                        const s = symbols[next(symbols.length)];
                        processed = `${s} ${processed} ${s}`;
                    }
                    const value = frame.template.replace('TEXT', processed);
                    if (seen.has(value)) continue;
                    seen.add(value);
                    added++;
                    results.push({
                        id: `extra-mix-${state.extraMixSeed}-${added}`,
                        text: value,
                        title: `مزيج مبتكر #${added}`,
                        cat: frame.cat || 'gaming'
                    });
                }
            }

            const seenTexts = new Set();
            return results.filter(item => {
                if (seenTexts.has(item.text)) return false;
                seenTexts.add(item.text);
                return true;
            });

        }

        function decodeDataText(value) {
            try { return decodeURIComponent(value || ''); }
            catch (error) { return ''; }
        }

        // --- RENDER & DOM INTERACTION ---
        const grid = document.getElementById('decorations-grid');
        const emptyState = document.getElementById('empty-state');
        const mainInput = document.getElementById('main-input');
        const charCount = document.getElementById('char-count');
        const searchFilter = document.getElementById('search-filter');
        const resultsCountEl = document.getElementById('results-count');
        const badgeAllEl = document.getElementById('badge-count-all');
        const badgeFavEl = document.getElementById('badge-count-fav');
        const themeToggleBtn = document.getElementById('theme-toggle');
        const btnClear = document.getElementById('btn-clear');
        const toggleMixMode = document.getElementById('toggle-mix-mode');
        const btnMoreMixes = document.getElementById('btn-more-mixes');
        const btnQuickRandom = document.getElementById('btn-quick-random');
        const btnCopyAll = document.getElementById('btn-copy-all');

        // Cache generated decorations so searching/categories don't regenerate them.
        let generatedCacheKey = '';
        let generatedCache = [];
        let visibleResults = [];
        let visibleLimit = 24;
        const RESULTS_PER_BATCH = 24;

        function getGeneratedDecorations(rawText) {
            const key = `${rawText}\u0000${state.mixMode}\u0000${state.extraMixSeed}`;
            if (key !== generatedCacheKey) {
                generatedCache = generateAllDecorations(rawText, state.mixMode);
                generatedCacheKey = key;
            }
            return generatedCache;
        }

        function makeDecorationCard(item) {
            const isFav = state.favorites.includes(item.text);
            const card = document.createElement('div');
            card.className = 'decor-card card-solid rounded-2xl p-4 flex flex-col justify-between gap-3 border border-slate-800/80 light:border-slate-200/80 hover:border-brand-500/50 light:hover:border-brand-500/50 shadow-md hover:shadow-xl transition relative group overflow-hidden';
            card.innerHTML = `
                <div class="flex items-center justify-between gap-2 border-b border-slate-800/40 light:border-slate-100 pb-2">
                    <span class="text-[11px] font-bold text-slate-400 light:text-slate-500 flex items-center gap-1.5"><i class="fa-solid fa-hashtag text-brand-500/70"></i>${escapeHtml(item.title)}</span>
                    <button class="btn-fav text-slate-500 hover:text-amber-400 transition text-sm p-1" data-text="${encodeURIComponent(item.text)}" title="${isFav ? 'إزالة من المفضلة' : 'إضافة للمفضلة'}"><i class="${isFav ? 'fa-solid fa-star text-amber-400' : 'fa-regular fa-star'}"></i></button>
                </div>
                <div class="py-2 px-1 my-auto overflow-x-auto text-center scrollbar-none"><span class="decor-text font-semibold text-lg sm:text-xl text-slate-100 light:text-slate-900 tracking-wide select-all" dir="auto">${escapeHtml(item.text)}</span></div>
                <div class="pt-2 border-t border-slate-800/40 light:border-slate-100 flex items-center justify-between">
                    <span class="text-[10px] text-slate-500 font-mono">${[...item.text].length} رموز</span>
                    <button class="btn-copy px-3.5 py-1.5 rounded-xl bg-brand-600/20 hover:bg-brand-600 text-brand-300 hover:text-white border border-brand-500/30 font-semibold text-xs transition flex items-center gap-1.5" data-text="${encodeURIComponent(item.text)}"><i class="fa-regular fa-copy"></i><span>نسخ</span></button>
                </div>`;
            return card;
        }

        function renderVisibleResults(append = false) {
            const oldMore = document.getElementById('btn-load-more-results');
            if (oldMore) oldMore.remove();
            const fragment = document.createDocumentFragment();
            const from = append ? grid.querySelectorAll('.decor-card').length : 0;
            const to = Math.min(visibleLimit, visibleResults.length);
            for (let i = from; i < to; i++) fragment.appendChild(makeDecorationCard(visibleResults[i]));
            if (!append) grid.replaceChildren();
            grid.appendChild(fragment);

            if (to < visibleResults.length) {
                const more = document.createElement('button');
                more.id = 'btn-load-more-results';
                more.className = 'col-span-full mx-auto my-3 px-6 py-3 rounded-xl bg-brand-600 text-white font-bold shadow-lg';
                more.textContent = `عرض ${Math.min(RESULTS_PER_BATCH, visibleResults.length - to)} نتيجة إضافية (${to} من ${visibleResults.length})`;
                more.addEventListener('click', () => {
                    visibleLimit += RESULTS_PER_BATCH;
                    renderVisibleResults(true);
                }, { once: true });
                grid.appendChild(more);
            }
        }

        function updateUI() {
            const rawText = getGraphemes(mainInput.value).slice(0, 80).join('');
            if (mainInput.value !== rawText) mainInput.value = rawText;
            state.inputText = rawText;
            charCount.textContent = `${getGraphemes(rawText).length} / 80 حرف`;

            const allGenerated = state.activeCategory === 'favorites'
                ? state.favorites.map((value, index) => ({ id: `favorite-${index}`, text: value, title: 'من المفضلة', cat: 'favorites' }))
                : getGeneratedDecorations(rawText);
            const q = state.searchQuery.trim().toLowerCase();
            visibleResults = allGenerated.filter(item => {
                if (state.activeCategory !== 'all' && state.activeCategory !== 'favorites' && item.cat !== state.activeCategory) return false;
                return !q || item.text.toLowerCase().includes(q) || item.title.toLowerCase().includes(q);
            });

            resultsCountEl.textContent = visibleResults.length;
            badgeAllEl.textContent = allGenerated.length;
            badgeFavEl.textContent = state.favorites.length;
            visibleLimit = RESULTS_PER_BATCH;

            if (!visibleResults.length) {
                grid.replaceChildren();
                emptyState.classList.remove('hidden');
                grid.classList.add('hidden');
            } else {
                emptyState.classList.add('hidden');
                grid.classList.remove('hidden');
                renderVisibleResults(false);
            }
        }

        // --- HELPER UTILITIES ---
        function escapeHtml(text) {
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        async function copyToClipboard(text, successMessage = 'تم نسخ الزخرفة بنجاح!') {
            if (typeof text !== 'string' || !text.length) return false;

            // Try the modern API first, then fall back for file:// and older Android WebViews.
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                    showToast(successMessage);
                    return true;
                }
            } catch (err) {
                // Continue to the legacy fallback below.
            }

            let textarea;
            try {
                textarea = document.createElement('textarea');
                textarea.value = text;
                textarea.setAttribute('readonly', '');
                textarea.setAttribute('aria-hidden', 'true');
                textarea.style.position = 'fixed';
                textarea.style.top = '0';
                textarea.style.left = '-9999px';
                textarea.style.opacity = '0';
                textarea.style.fontSize = '16px';
                document.body.appendChild(textarea);
                textarea.focus();
                textarea.select();
                textarea.setSelectionRange(0, textarea.value.length);

                const copied = document.execCommand && document.execCommand('copy');
                if (!copied) throw new Error('Clipboard unavailable');
                showToast(successMessage);
                return true;
            } catch (err) {
                showToast('تعذر النسخ؛ حدّد النص وانسخه يدويًا');
                return false;
            } finally {
                if (textarea && textarea.parentNode) textarea.remove();
            }
        }

        function showToast(message) {
            const container = document.getElementById('toast-container'); container.replaceChildren();
            const toast = document.createElement('div');
            toast.className = 'pointer-events-auto bg-slate-900 light:bg-slate-800 text-slate-100 px-4 py-2.5 rounded-2xl shadow-2xl border border-brand-500/40 text-xs sm:text-sm font-bold flex items-center gap-2 transform translate-y-4 opacity-0 transition duration-300';
            toast.innerHTML = '<i class="fa-solid fa-circle-check text-emerald-400"></i> <span></span>';
            toast.querySelector('span').textContent = String(message);
            
            container.appendChild(toast);

            // Animate in
            requestAnimationFrame(() => {
                toast.classList.remove('translate-y-4', 'opacity-0');
            });

            // Remove after 2.5s
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => {
                    toast.remove();
                }, 300);
            }, 2200);
        }

        // --- EVENT LISTENERS ---
        // Input typing
        let _dt; mainInput.addEventListener('input', () => { clearTimeout(_dt); _dt = setTimeout(updateUI, 150); });

        btnClear.addEventListener('click', () => {

        // Generate More Mixes
        btnCopyAll.addEventListener('click', () => {
            const q = state.searchQuery.trim().toLowerCase();
            // Reuse the exact generated set shown on screen, including extra mixes.
            const sourceItems = state.activeCategory === 'favorites'
                ? state.favorites.map((value, index) => ({ id: `favorite-${index}`, text: value, title: 'من المفضلة', cat: 'favorites' }))

function orderedChars(txt) {
    // Reverse RTL Arabic text visually so ASCII/Block art reads right-to-left properly
    const hasAr = /[\u0600-\u06FF]/.test(txt);
    const chars = [...txt];
    return hasAr ? chars.reverse() : chars;
}

function bigLines(txt, f, e) {
    const rows = ['', '', '', '', ''];
    orderedChars(txt).forEach(ch => {
        const g = PIX[ch];
        if (!g) {
            rows[0] += '  ';
            rows[1] += '  ';
            rows[2] += ch + e;
            rows[3] += '  ';
            rows[4] += '  ';
            return;
        }
        for (let r = 0; r < 5; r++) {
            let line = '';
            for (let b = 4; b >= 0; b--) line += (g[r] >> b) & 1 ? f : e;
            rows[r] += line + e;
        }
    });
    return rows.join('\n');
}

function ansiShadowLines(txt) {
    const rows = ['', '', '', '', '', ''];
    orderedChars(txt).forEach(ch => {
        const g = PIX[ch];
        if (!g) {
            for (let r = 0; r < 6; r++) rows[r] += (r === 2 ? ch + ' ' : '  ');
            return;
        }
        const grid = Array.from({length: 6}, () => Array(6).fill(' '));
        for (let r = 0; r < 5; r++) {
            for (let b = 4; b >= 0; b--) {
                if ((g[r] >> b) & 1) {
                    const c = 4 - b;
                    grid[r][c] = '█';
                    if (grid[r][c + 1] === ' ') grid[r][c + 1] = '╗';
                    if (grid[r + 1][c] === ' ') grid[r + 1][c] = '═';
                    if (grid[r + 1][c + 1] === ' ') grid[r + 1][c + 1] = '╝';
                }
            }
        }
        for (let r = 0; r < 6; r++) rows[r] += grid[r].join('') + ' ';
    });
    return rows.join('\n');
}

}
(() => { let t; document.getElementById('big-input').addEventListener('input', () => { clearTimeout(t); t = setTimeout(renderBig, 200); }); })();
document.getElementById('big-list').addEventListener('click', e => {
    const b = e.target.closest('.cbtn'); if (b) copyToClipboard(bigOut[b.dataset.i], 'تم نسخ الكتابة الكبيرة');
});

// Theme Toggle (Dark / Light)
        function applyTheme(theme) {
            const root = document.documentElement;
            const isLight = theme === 'light';
            root.classList.toggle('light', isLight);
            root.classList.toggle('dark', !isLight);
            try { window.localStorage.setItem('v_decor_theme', isLight ? 'light' : 'dark'); } catch (error) {}
            const themeColor = document.querySelector('meta[name="theme-color"]');
            if (themeColor) themeColor.setAttribute('content', isLight ? '#f8fafc' : '#0f172a');
            const ic = document.getElementById('theme-icon'); if (ic) ic.textContent = isLight ? '☀️' : '🌙';
            
            
            
            themeToggleBtn.title = isLight ? 'تفعيل الوضع الليلي' : 'تفعيل الوضع النهاري';
            themeToggleBtn.setAttribute('aria-label', themeToggleBtn.title);
        }
        themeToggleBtn.addEventListener('click', () => {
            applyTheme(document.documentElement.classList.contains('dark') ? 'light' : 'dark');
        });
        // Init Theme on Load
        let savedTheme = 'dark';
        savedTheme = readStoredString('v_decor_theme', 'dark') === 'light' ? 'light' : 'dark';
        applyTheme(savedTheme);

        // Initial Render
        window.addEventListener('DOMContentLoaded', () => {
            updateUI();
        });

        // Tiny tap feedback: works for static and dynamically-created buttons.
        document.addEventListener('click', (event) => {
            const button = event.target.closest('button');
            if (!button || button.disabled) return;
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
            // Restart only this short feedback animation; the action itself is never delayed.
            button.classList.remove('tap-feedback');
            requestAnimationFrame(() => {
                if (button.isConnected && !button.disabled) button.classList.add('tap-feedback');
            });
        }, true);

        document.addEventListener('animationend', (event) => {
            if (event.animationName === 'buttonTap') {
                event.target.classList.remove('tap-feedback');
            }
        });

    </script>
